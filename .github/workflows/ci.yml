name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/router[dev]" -e "apps/core[dev]"
      - name: Lint (ruff)
        run: python -m ruff check apps/router apps/core
      - name: Test router + core
        run: python -m pytest apps/router apps/core -q -p no:cacheprovider

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Build MCP server
        working-directory: apps/mcp
        run: |
          bun install
          bun run build
      - name: Bundle CLI (validates module graph incl. bun import)
        working-directory: apps/cli
        run: |
          bun install
          bun build src/index.ts --outfile /tmp/forge-cli.js
      - name: Typecheck opencode-pack plugin against @opencode-ai/plugin
        working-directory: packages/opencode-pack
        run: |
          npm ci
          npm run typecheck

  smoke:
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -e "apps/router" -e "apps/core"
          python -c "import forge_router.main, forge_core.main; print('imports ok')"
      - name: Boot router and hit endpoints
        run: |
          python -m uvicorn forge_router.main:app --port 4010 &
          corepid=$!
          sleep 3
          curl -fsS http://127.0.0.1:4010/healthz
          curl -fsS http://127.0.0.1:4010/v1/models
          curl -fsS http://127.0.0.1:4010/forge/quota | python -m json.tool > /dev/null
          kill $corepid

  hard-e2e:
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/router" openai
      - name: Run the hard failover + load harness
        run: python -u scripts/hard_failover_test.py

  lint-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML providers config
        run: python -c "import yaml; yaml.safe_load(open('apps/router/providers.example.yaml')); print('yaml ok')"
      - name: Validate opencode config JSON
        run: python -c "import json; json.load(open('packages/opencode-pack/opencode.jsonc')); print('json ok')"