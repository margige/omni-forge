[project]
name = "forge-core"
version = "0.1.0"
description = "omni-forge multimodal generation service: image, video, speech, vision, search."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "edge-tts>=6.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
forge-core = "forge_core.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forge_core*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
