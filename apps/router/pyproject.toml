[project]
name = "forge-router"
version = "0.1.0"
description = "omni-forge free-tier failover router: one OpenAI-compatible endpoint, many free providers."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
forge-router = "forge_router.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forge_router*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]