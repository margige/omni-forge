<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>omni-forge</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font: 15px/1.6 'Segoe UI', system-ui, sans-serif;
      background: #07070d;
      color: #e2e2e8;
      min-height: 100dvh;
      display: flex; flex-direction: column;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: -1;
      background:
        radial-gradient(ellipse 80% 50% at 20% 20%, rgba(88,166,255,.07) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(163,113,247,.07) 0%, transparent 60%);
      animation: bgShift 25s ease-in-out infinite alternate;
    }
    @keyframes bgShift { to { filter: hue-rotate(12deg); } }

    .shell { width: 100%; max-width: min(1200px, 100vw); margin: 0 auto; padding: clamp(16px, 3vw, 32px); display: flex; flex-direction: column; gap: 20px; flex: 1; }

    header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; position: relative; }
    header h1 { font-size: clamp(22px, 4vw, 30px); font-weight: 800; letter-spacing: -.5px; }
    header h1 span { background: linear-gradient(135deg, #58a6ff, #a371f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .spacer { flex: 1; }
    .badge { font-size: 12px; padding: 3px 10px; border-radius: 999px; white-space: nowrap; font-weight: 600; }
    .badge.ok { background: rgba(46,160,67,.2); color: #56d364; }
    .badge.warn { background: rgba(210,153,34,.2); color: #d29922; }
    .badge.down { background: rgba(248,81,73,.2); color: #f85149; }
    .lang-select {
      background: rgba(33,38,47,.8); color: #e2e2e8; border: 1px solid #30363d;
      border-radius: 6px; padding: 6px 10px; font-size: 13px; cursor: pointer;
    }

    .card {
      background: rgba(22,27,34,.75);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(48,54,61,.6);
      border-radius: 14px; padding: clamp(16px, 2.5vw, 22px);
      transition: border-color .3s;
    }
    .card:hover { border-color: rgba(88,166,255,.25); }
    .card h2 { font-size: clamp(14px, 2vw, 17px); font-weight: 700; margin-bottom: 14px; color: #c9d1d9; }

    /* Collapsible failover */
    .toggle-btn {
      background: rgba(33,38,47,.8); color: #8b949e; border: 1px solid #30363d;
      border-radius: 6px; padding: 4px 12px; font-size: 12px; cursor: pointer;
      font-family: inherit; transition: all .2s; user-select: none;
    }
    .toggle-btn:hover { border-color: #58a6ff; color: #e2e2e8; }
    .toggle-btn.open { color: #58a6ff; border-color: #58a6ff; }
    .failover-panel { overflow: hidden; transition: max-height .35s ease, opacity .3s; max-height: 600px; opacity: 1; }
    .failover-panel.closed { max-height: 0; opacity: 0; pointer-events: none; }

    /* Split layout */
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; min-height: 500px; }
    .panel { display: flex; flex-direction: column; }
    .panel-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: #8b949e; margin-bottom: 10px; }
    @media (max-width: 860px) { .split { grid-template-columns: 1fr; } }

    /* Quota table */
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid rgba(48,54,61,.5); font-size: 13px; }
    th { color: #8b949e; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: .5px; }
    .bar { height: 6px; background: rgba(33,38,47,.8); border-radius: 3px; overflow: hidden; min-width: 44px; }
    .bar i { display: block; height: 100%; background: linear-gradient(90deg, #2ea043, #58a6ff); border-radius: 3px; transition: width .5s; }

    /* Chips */
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .chip {
      padding: 5px 14px; border-radius: 999px; font-size: 12px; font-weight: 600;
      background: rgba(33,38,47,.8); border: 1px solid #30363d; color: #8b949e;
      cursor: pointer; transition: all .2s; user-select: none;
    }
    .chip:hover { border-color: #58a6ff; color: #e2e2e8; }
    .chip.active { background: rgba(88,166,255,.15); border-color: #58a6ff; color: #58a6ff; }

    /* Form */
    .form { display: flex; flex-direction: column; gap: 14px; }
    .form-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .form-row.full { width: 100%; }
    input[type="text"], textarea, select, button {
      background: rgba(22,27,34,.95); color: #e2e2e8; border: 1px solid #30363d;
      border-radius: 8px; padding: 10px 14px; font-size: 14px; font-family: inherit;
      transition: border-color .2s, box-shadow .2s;
    }
    input[type="text"]:focus, textarea:focus, select:focus {
      outline: none; border-color: #58a6ff; box-shadow: 0 0 0 3px rgba(88,166,255,.15);
    }
    input[type="text"] { flex: 1 1 200px; min-width: 160px; }
    /* Auto-resize textarea */
    textarea { resize: none; min-height: 80px; max-height: 40vh; overflow: hidden; line-height: 1.6; }
    select { cursor: pointer; min-width: 140px; }
    select option { background: #161b22; color: #e2e2e8; }
    select.model-pick { flex: 1; min-width: 180px; }
    .model-state { font-size: 12px; color: #8b949e; white-space: nowrap; }

    /* Buttons */
    button {
      background: linear-gradient(135deg, #1f6feb, #a371f7); border: none; color: #fff;
      font-weight: 700; cursor: pointer; position: relative; overflow: hidden;
    }
    button:hover { opacity: .9; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    button .spinner { display: none; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; }
    button.loading .spinner { display: inline-block; }
    button.loading .label { opacity: .7; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Result area */
    .hint { margin-top: 10px; font-size: 13px; color: #8b949e; font-style: italic; }
    .bubble {
      background: rgba(10,14,20,.8); border: 1px solid rgba(48,54,61,.5);
      border-radius: 10px; padding: 16px; white-space: pre-wrap; overflow-wrap: anywhere;
      font-size: 14px; line-height: 1.7; color: #d1d5da;
      animation: fadeIn .3s ease;
    }
    .bubble img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; transition: transform .3s; }
    .bubble img:hover { transform: scale(1.01); }
    .bubble video { max-width: 100%; border-radius: 8px; margin-top: 8px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .meta { margin-top: 10px; font-size: 12px; color: #8b949e; }
    .meta .tag { display: inline-block; background: rgba(88,166,255,.1); color: #58a6ff; padding: 2px 8px; border-radius: 4px; margin-right: 6px; font-size: 11px; }

    /* Audio: user must click play */
    audio { width: 100%; margin-top: 8px; border-radius: 8px; accent-color: #58a6ff; }

    /* Video status */
    .video-status { text-align: center; padding: 20px; }
    .video-status .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid rgba(88,166,255,.3); border-top-color: #58a6ff; border-radius: 50%; animation: spin .8s linear infinite; }
    .video-status .job-id { font-family: monospace; font-size: 12px; color: #8b949e; margin-top: 8px; word-break: break-all; }

    /* Search results */
    .results { list-style: none; padding: 0; margin-top: 12px; }
    .results li { margin: 8px 0; padding: 8px 10px; background: rgba(22,27,34,.5); border-radius: 6px; }
    .results a { color: #58a6ff; text-decoration: none; word-break: break-all; font-weight: 600; }
    .results a:hover { text-decoration: underline; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #484f58; }

    .hidden { display: none !important; }
  </style>
</head>

  <div class="shell">

    <div class="grid">

          <button class="toggle-btn" id="failoverToggle" onclick="toggleFailover()">▸ failover</button>
        </div>
        <div class="chips" id="capChips"></div>

        <form id="genForm" class="form">
          <div class="form-row">
            <select id="kind" style="flex:1;min-width:120px">
              <option value="chat">Chat</option>
              <option value="image">Image</option>
              <option value="tts">Speech</option>
              <option value="search">Search</option>
              <option value="asr">Transcribe</option>
              <option value="video">Video</option>
            </select>
            <select id="modelPick" class="model-pick">
              <option value="forge-chat">forge-chat · auto</option>
            </select>
            <span class="model-state" id="providerState"></span>
          </div>

          <div class="form-row hidden" id="voiceRow">
            <select id="voice" style="flex:1;min-width:160px">
              <option value="">auto</option>
              <optgroup label="中文">
                <option>zh-CN-XiaoxiaoNeural</option>
                <option>zh-CN-YunxiNeural</option>
                <option>zh-CN-YunyangNeural</option>
              </optgroup>
              <optgroup label="English">
                <option>en-US-AriaNeural</option>
                <option>en-US-JennyNeural</option>
                <option>en-GB-RyanNeural</option>
                <option>en-US-StudioNeural</option>
              </optgroup>
              <optgroup label="日本語">
                <option>ja-JP-NanamiNeural</option>
                <option>ja-JP-EmuNeural</option>
              </optgroup>
              <optgroup label="한국어">
                <option>ko-KR-SunHiNeural</option>
                <option>ko-KR-InNeural</option>
              </optgroup>
            </select>
          </div>

          <div class="form-row full">
            <input type="text" id="prompt" data-i18n-ph="t.promptPh" placeholder="ask or describe — e.g. a cyberpunk cat in the rain" style="flex:1" />
            <input type="file" id="audioFile" accept="audio/*" class="hidden" />
          </div>
          <div class="form-row full hidden" id="aspectRow">
            <select id="aspect" style="flex:1">
              <option value="1:1">1:1</option>
              <option value="16:9">16:9</option>
              <option value="9:16">9:16</option>
              <option value="4:3">4:3</option>
              <option value="3:4">3:4</option>
            </select>
          </div>

          <button type="submit" id="submitBtn" data-i18n="t.generate" style="align-self:flex-start;padding:10px 28px">
            <span class="spinner"></span>
            <span class="label">Generate</span>
          </button>
        </form>
        <div class="hint" id="kindHint"></div>
      </div>

      <!-- Right: Output panel -->
      <div class="card panel">
        <div class="panel-label">Output</div>
        <div id="result" style="flex:1;overflow-y:auto"></div>
      </div>
    </div>

    <!-- Collapsible failover card -->
    <div id="failoverCard" class="card failover-panel">
      <h2 data-i18n="t.failover">Free-tier failover</h2>
      <table>
        <thead><tr><th>provider</th><th>status</th><th>requests / rpd</th><th>cooldown</th></tr></thead>
        <tbody id="quotaRows"><tr><td colspan="4" class="muted">loading…</td></tr></tbody>
      </table>
      <div class="muted" id="quotaNote" style="font-size:12px;margin-top:8px"></div>
    </div>
  </div>

    let MODEL_META = {};

    function t(key) {
      let s = (I18N[LANG] && I18N[LANG][key]) || I18N.en[key] || key;
      const args = Array.prototype.slice.call(arguments, 1);
      args.forEach((a, i) => { s = s.split("{" + i + "}").join(String(a)); });
      return s;
    }

    function setBadge(el, cls, txt) { el.textContent = txt; el.className = "badge " + cls; }

    async function loadCaps() {
      try { const res = await fetch(CORE + "/forge/health"); CAPS = res.ok ? await res.json() : {}; } catch (_) { CAPS = {}; }
      renderCaps();
    }
    function capState(kind) {
      const list = (CAPS.capabilities || {})[kind] || [];
      return { available: list.some(b => b.available), names: list.map(b => b.available ? b.name : null).filter(Boolean) };
    }
    function renderCaps() {
      const box = document.getElementById("capChips"); box.innerHTML = "";
      const order = ["chat","image","tts","search","asr","video"];
      const labels = {chat:t("t.kindChat"),image:t("t.kindImage"),tts:t("t.kindTts"),search:t("t.kindSearch"),asr:t("t.kindAsr"),video:t("t.kindVideo")};
      order.forEach(k => {
        const s = capState(k);
        const d = document.createElement("span");
        d.className = "chip" + (k === "chat" ? " active" : s.available ? " active" : "");
        d.textContent = labels[k] + (k === "chat" ? " ●" : "");
        d.title = s.names.join(", ");
        d.addEventListener("click", () => { document.getElementById("kind").value = k; onKindChange(); });
        box.appendChild(d);
      });
    }

    async function loadModels() {
      const pick = document.getElementById("modelPick");
      const kind = document.getElementById("kind").value;
      try {
        const res = await fetch("/forge/models");
        if (!res.ok) throw new Error(String(res.status));
        const data = await res.json();
        MODEL_META = {};
        const sel = pick.value || "forge-chat";
        pick.innerHTML = "";
        const add = (val, label, healthy) => {
          const o = document.createElement("option");
          o.value = val; o.textContent = label;
          if (healthy === false) o.textContent += " ⚠";
          pick.appendChild(o);
        };
        const shown = data.entries.filter(e => e.kind === "chat" || (kind === "image" && e.kind === "image"));
        shown.forEach(e => {
          add(e.model, (e.local ? t("local") + " · " : "") + (e.auto ? "forge-chat · " + t("auto") : e.provider + ": " + e.label), e.healthy);
          MODEL_META[e.model] = e;
        });
        pick.value = MODEL_META[sel] ? sel : "forge-chat";
        onModelChange();
      } catch (_) {
        pick.innerHTML = '<option value="forge-chat">forge-chat · auto</option>';
        MODEL_META = { "forge-chat": { label: "forge-chat", provider: "*", healthy: true } };
      }
    }
    function onModelChange() {
      const pick = document.getElementById("modelPick");
      const state = document.getElementById("providerState");
      const meta = MODEL_META[pick.value];
      state.textContent = meta ? (meta.healthy ? t("modelStateOk") + (meta.local ? " · " + t("local") : "") : t("modelStateDown")) : "";
      state.style.color = meta && !meta.healthy ? "#f85149" : "#8b949e";
    }

    const HINTS = {chat:"hintChat",image:"hintImage",tts:"hintTts",search:"hintSearch",asr:"hintAsr",video:"hintVideo"};
    function onKindChange() {
      const kind = document.getElementById("kind").value;
      document.getElementById("prompt").style.display = kind === "asr" ? "none" : "";
      document.getElementById("audioFile").style.display = kind === "asr" ? "" : "none";
      document.getElementById("aspectRow").classList.toggle("hidden", kind !== "image");
      document.getElementById("voiceRow").classList.toggle("hidden", kind !== "tts");
      document.getElementById("kindHint").textContent = t(HINTS[kind]);
      loadModels();
      document.querySelectorAll("#capChips .chip").forEach((c, i) => {
        const k = ["chat","image","tts","search","asr","video"][i];
        c.classList.toggle("active", k === kind || (k === "chat" && kind === "chat"));
      });
    }

    async function refreshQuota() {
      const badge = document.getElementById("routerStatus");
      const rows = document.getElementById("quotaRows");
      try {
        const res = await fetch("/forge/quota");
        if (!res.ok) throw new Error(String(res.status));
        const data = await res.json();
        badge.textContent = t("routerOk"); badge.className = "badge ok";
        rows.innerHTML = "";
        let noKeys = 0;
        data.providers.forEach(p => {
          const tr = document.createElement("tr");
          const pct = p.rpd ? Math.min(100, (p.requests_today / p.rpd) * 100) : 0;
          if (p.missing_key) noKeys++;
          let badgeHtml;
          if (p.missing_key) badgeHtml = '<span class="badge warn">' + t("nokey") + "</span>";
          else if (p.healthy) badgeHtml = '<span class="badge ok">' + t("ok") + "</span>";
          else badgeHtml = '<span class="badge down">' + t("down") + "</span>";
          tr.innerHTML = "<td>" + p.name + (p.local ? " (" + t("local") + ")" : "") + "</td>" +
            "<td>" + badgeHtml + "</td>" +
            "<td><div class='bar'><i style='width:" + pct + "%'></i></div>" + p.requests_today + (p.rpd ? "/" + p.rpd : "") + "</td>" +
            "<td>" + p.cooling_remaining + "s</td>";
          rows.appendChild(tr);
        });
        document.getElementById("quotaNote").textContent =
          (noKeys > 0 ? t("missingKeys") + " " : "") + t("quotaNote", data.model);
      } catch (err) {
        badge.textContent = t("routerOffline"); badge.className = "badge down";
        rows.innerHTML = '<tr><td colspan="4" class="muted">' + t("offlineRow", "forge up") + '</td></tr>';
      }
    }

    async function runChat(prompt, box) {
      const model = document.getElementById("modelPick").value;
      box.innerHTML = '<div class="bubble" style="opacity:.5">' + t("working") + '</div>';
      const res = await fetch("/v1/chat/completions", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ model, messages: [{ role: "user", content: prompt }], stream: false }),
      });
      const j = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(JSON.stringify(j).slice(0, 300));
      const text = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || "";
      const f = j._forge || {};
      box.innerHTML = '<div class="bubble">' + text.replace(/</g, "&lt;") + '</div>' +
        '<p class="meta">' + t("chatProvider", f.provider || "?", f.model || "?") + '</p>';
      loadModels();
    }

    async function renderResult(box, kind, j) {
      if (kind === "image") {
        box.innerHTML = '<div class="bubble"><img src="' + CORE + j.url + '" alt="generated" /></div>' +
          '<p class="meta"><span class="tag">' + t("backendImage", j.backend, j.width, j.height) + '</span></p>' +
          (j._note ? '<p class="badge warn" style="margin-top:8px">' + j._note + '</p>' : "");
      } else if (kind === "tts") {
        // User must click play — no auto-play
        try {
          const resp = await fetch(CORE + j.url);
          const blob = await resp.blob();
          const url = URL.createObjectURL(blob);
          const audio = document.createElement("audio");
          audio.controls = true;
          audio.preload = "auto";
          audio.style.width = "100%";
          audio.src = url;
          box.innerHTML = '<div class="meta"><span class="tag">' + t("backendTts", j.backend, j.voice || "auto") + '</span></div>';
          box.appendChild(audio);
        } catch (_) {
          box.innerHTML = '<a class="muted" href="' + CORE + j.url + '">' + t("download") + '</a>' +
            '<p class="meta">' + t("backendTts", j.backend, j.voice || "auto") + '</p>';
        }
      } else if (kind === "video") {
        // Poll for completion
        const jobId = j.job_id;
        box.innerHTML = '<div class="video-status"><div class="spinner"></div>' +
          '<p style="margin-top:12px">' + t("generating") + '</p>' +
          '<p class="job-id">' + t("job") + ': ' + jobId + '</p></div>';
        await pollVideo(box, jobId);
      } else if (kind === "search") {
        const list = (j.results || []).map(r =>
          '<li><a href="' + r.url + '" target="_blank" rel="noopener">' + r.title + '</a><br><span style="font-size:12px;color:#8b949e">' + (r.snippet || "").replace(/</g, "&lt;") + '</span></li>').join("");
        box.innerHTML = '<p class="meta">' + t("searchMeta", j.backend || "?") + '</p><ul class="results">' + (list || '<li class="muted">…</li>') + '</ul>';
      } else if (kind === "asr") {
        const lang = j.language || "?";
        box.innerHTML = '<p>' + t("asrResult", lang) + ' <div class="bubble">' + (j.text || "").replace(/</g, "&lt;") + '</div></p>';
      } else {
        box.innerHTML = '<div class="bubble">' + String(j).replace(/</g, "&lt;") + '</div>';
      }
    }

    async function pollVideo(box, jobId) {
      const maxAttempts = 120; // 4 minutes at 2s intervals
      for (let i = 0; i < maxAttempts; i++) {
        try {
          const res = await fetch(CORE + "/v1/video/" + jobId);
          const j = await res.json();
          const job = j.job;
          if (!job) { box.innerHTML = '<span class="badge down">' + t("error", "job not found") + '</span>'; return; }
          if (job.status === "done") {
            const result = job.result || {};
            box.innerHTML = '<div class="bubble"><video controls src="' + CORE + result.url + '" style="max-width:100%;border-radius:8px;margin-top:8px" /></div>' +
              '<p class="meta"><span class="tag">backend: ' + (result.backend || "wan") + '</span></p>';
            return;
          }
          if (job.status === "error") {
            box.innerHTML = '<span class="badge down">' + t("error", job.error || "unknown") + '</span>';
            return;
          }
        } catch (_) {}
        await new Promise(r => setTimeout(r, 2000));
      }
      box.innerHTML += '<p class="muted" style="margin-top:8px">' + t("generating") + '…</p>';
    }

    document.getElementById("genForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const kind = document.getElementById("kind").value;
      const prompt = document.getElementById("prompt").value;
      const aspect = document.getElementById("aspect").value;
      const box = document.getElementById("result");
      const btn = document.getElementById("submitBtn");
      btn.classList.add("loading"); btn.disabled = true;
      box.innerHTML = '<div class="bubble" style="opacity:.5">' + t("working") + '</div>';
      try {
        if (kind === "chat") return await runChat(prompt, box);
        if (kind === "search") {
          const q = encodeURIComponent(prompt);
          const j = await (await fetch(CORE + "/v1/search?q=" + q + "&limit=8")).json();
          const list = (j.results || []).map(r =>
            '<li><a href="' + r.url + '" target="_blank" rel="noopener">' + r.title + '</a><br><span style="font-size:12px;color:#8b949e">' + (r.snippet || "").replace(/</g, "&lt;") + '</span></li>').join("");
          box.innerHTML = '<p class="meta">' + t("searchMeta", j.backend || "?") + '</p><ul class="results">' + (list || '<li class="muted">…</li>') + '</ul>';
          return;
        }
        if (kind === "asr") {
          const file = document.getElementById("audioFile").files[0];
          if (!file) throw new Error("no file");
          const fd = new FormData(); fd.append("file", file);
          const j = await (await fetch(CORE + "/v1/asr", { method: "POST", body: fd })).json();
          if (!j.text) throw new Error(j.error || "transcription failed");
          box.innerHTML = '<p>' + t("asrResult", j.language || "?") + ' <div class="bubble">' + (j.text || "").replace(/</g, "&lt;") + '</div></p>';
          return;
        }
        let body;
        if (kind === "tts") {
          body = { text: prompt, voice: document.getElementById("voice").value || undefined };
        } else {
          body = Object.assign({ prompt, aspect },
            document.getElementById("modelPick").value.startsWith("openrouter/")
              ? { backend: "openrouter", model: document.getElementById("modelPick").value.slice("openrouter/".length) }
              : {});
        }
        const res = await fetch(CORE + "/v1/" + kind, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
        const j = await res.json();
        if (!res.ok) throw new Error(JSON.stringify(j));
        await renderResult(box, kind, j);
      } catch (err) {
        box.innerHTML = '<span class="badge down">' + t("error", err.message) + '</span>';
      } finally {
        btn.classList.remove("loading"); btn.disabled = false;
      }
    });

    document.getElementById("kind").addEventListener("change", onKindChange);
    document.getElementById("modelPick").addEventListener("change", onModelChange);

    // Auto-resize textarea
    const promptEl = document.getElementById("prompt");
    promptEl.addEventListener("input", function() {
      this.style.height = "auto";
      this.style.height = Math.min(this.scrollHeight, 40 * 16) + "px";
    });

    const saved = localStorage.getItem("forge-lang");
    const nav = (navigator.language || "en").toLowerCase();
    document.getElementById("lang").value = saved || (nav.startsWith("zh") ? "zh" : nav.startsWith("ja") ? "ja" : nav.startsWith("ko") ? "ko" : "en");
    document.getElementById("lang").addEventListener("change", applyLang);

    async function applyLang() {
      LANG = document.getElementById("lang").value;
      localStorage.setItem("forge-lang", LANG);
      document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
      document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
      translateOptions("kind", {chat:t("t.kindChat"),image:t("t.kindImage"),tts:t("t.kindTts"),search:t("t.kindSearch"),asr:t("t.kindAsr"),video:t("t.kindVideo")});
      translateOptions("aspect", {"1:1":"1:1","16:9":"16:9","9:16":"9:16","4:3":"4:3","3:4":"3:4"});
      const btnLabel = document.querySelector("#submitBtn .label");
      if (btnLabel) btnLabel.textContent = t("t.generate");
      onKindChange(); refreshQuota(); loadCaps(); loadModels();
    }

    function translateOptions(selectId, map) {
      const sel = document.getElementById(selectId);
      if (!sel) return;
      Array.from(sel.options).forEach(o => { const k = o.value; if (map[k] !== undefined) o.textContent = map[k]; });
    }

    function toggleFailover() {
      const card = document.getElementById("failoverCard");
      const btn = document.getElementById("failoverToggle");
      const closed = card.classList.toggle("closed");
      btn.textContent = closed ? "▸ failover" : "▾ failover";
      btn.classList.toggle("open", !closed);
    }

    async function init() {
      onKindChange();
      refreshQuota();
      loadCaps();
      loadModels();
      document.getElementById("failoverCard").classList.add("closed");
      document.getElementById("failoverToggle").textContent = "▸ failover";
      setInterval(refreshQuota, 10000);
    }
    init();
  </script>
</body>
</html>
