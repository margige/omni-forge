<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>omni-forge</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font: 14px/1.5 system-ui, sans-serif;
      margin: 0; padding: clamp(12px, 2.5vw, 24px);
      background: #0f1115; color: #e6e6e6;
      min-height: 100dvh; display: flex; flex-direction: column;
    }
    .shell { width: 100%; max-width: min(1280px, 100vw); margin: 0 auto; display: flex; flex-direction: column; gap: 14px; flex: 1; }
    header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: clamp(16px, 3vw, 20px); }
    header h1 span { color: #58a6ff; }
    .spacer { flex: 1; }
    .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
    .ok { background: #1f6f3f; color: #d2ffe0; }
    .warn { background: #6e4b0a; color: #ffe9c2; }
    .down { background: #8b1e1e; color: #ffd9d9; }
    .muted { color: #8b949e; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: clamp(12px, 2vw, 16px); min-width: 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #21262d; }
    th { color: #8b949e; font-weight: 600; }
    .bar { height: 8px; background: #21262d; border-radius: 4px; overflow: hidden; min-width: 48px; }
    .bar i { display: block; height: 100%; background: linear-gradient(90deg, #2ea043, #58a6ff); }
    form { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
    input, select, button, textarea {
      background: #21262d; color: #e6e6e6; border: 1px solid #30363d;
      border-radius: 6px; padding: 8px 12px; font-size: 14px; font-family: inherit;
    }
    input[type="text"], textarea { flex: 1 1 260px; min-width: 220px; width: auto; }
    textarea { resize: vertical; min-height: 40px; max-height: 45vh; }
    button { background: #1f6feb; border-color: #1f6feb; cursor: pointer; font-weight: 600; }
    button:hover { background: #388bfd; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(460px, 100%), 1fr)); gap: clamp(12px, 2vw, 16px); }
    img.result { max-width: 100%; height: auto; border-radius: 8px; margin-top: 12px; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .cap { display: flex; align-items: center; gap: 6px; }
    .hint { margin-top: 10px; font-size: 13px; }
    .bubble { background: #10151d; border: 1px solid #30363d; border-radius: 8px;
             padding: 12px; margin-top: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .results { list-style: none; padding: 0; margin: 8px 0 0; }
    .results li { margin: 8px 0; overflow-wrap: anywhere; }
    .results a { color: #58a6ff; text-decoration: none; word-break: break-all; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    select.model-pick { max-width: 100%; }
    .muted.small { font-size: 12px; }
    .provider-state { margin-left: auto; font-size: 12px; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>omni<span>-forge</span></h1>
      <span id="routerStatus" class="badge" data-i18n="routerStatusDefault">router …</span>
      <span class="spacer"></span>
      <span class="muted" data-i18n="langLabel">language</span>
      <select id="lang">
        <option value="en">English</option>
        <option value="zh">简体中文</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
      </select>
    </header>

    <div class="grid">
      <div class="card">
        <h2 data-i18n="t.failover">Free-tier failover</h2>
        <table>
          <thead>
            <tr>
              <th data-i18n="t.provider">provider</th>
              <th data-i18n="t.health">health</th>
              <th data-i18n="t.requests">requests / rpd</th>
              <th data-i18n="t.cooldown">cooldown</th>
            </tr>
          </thead>
          <tbody id="quotaRows"><tr><td colspan="4" class="muted" data-i18n="t.loading">loading…</td></tr></tbody>
        </table>
        <div class="muted small" id="quotaNote"></div>
      </div>

      <div class="card">
        <h2 data-i18n="t.quick">Quick generation</h2>
        <div class="chips" id="capChips"></div>

        <form id="genForm">
          <div class="row" id="modelRow" style="width:100%">
            <label class="muted" for="modelPick" data-i18n="t.model">model</label>
            <select id="modelPick" class="model-pick">
              <option value="forge-chat">forge-chat · auto</option>
            </select>
            <span class="provider-state muted" id="providerState"></span>
          </div>
          <input type="text" id="prompt" data-i18n-ph="t.promptPh"
                 placeholder="a cyberpunk cat in the rain, neon, cinematic" />
          <input type="file" id="audioFile" accept="audio/*" style="display:none" />
          <select id="kind">
            <option value="chat" data-i18n="t.kindChat">chat</option>
            <option value="image" data-i18n="t.kindImage">image</option>
            <option value="tts" data-i18n="t.kindTts">speech</option>
            <option value="search" data-i18n="t.kindSearch">search</option>
            <option value="asr" data-i18n="t.kindAsr">transcribe</option>
            <option value="video" data-i18n="t.kindVideo">video</option>
          </select>
          <select id="aspect" style="display:none">
            <option value="1:1">1:1</option>
            <option value="16:9">16:9</option>
            <option value="9:16">9:16</option>
            <option value="4:3">4:3</option>
            <option value="3:4">3:4</option>
          </select>
          <button data-i18n="t.generate">generate</button>
        </form>
        <div class="hint muted" id="kindHint"></div>
        <div id="result"></div>
      </div>
    </div>
  </div>

  <script>
    const CORE = "http://127.0.0.1:4020";

    const I18N = {

      },

        "t.requests": "リクエスト / 日次枠", "t.cooldown": "クールダウン", "t.loading": "読み込み中…",
        "t.quick": "クイック生成", "t.promptPh": "質問または説明 — 例:雨の夜のサイバーパンク猫",

      },

        modelStateOk: "사용 가능", modelStateDown: "현재 사용 불가",
        offlineRow: "라우터 오프라인 — {0} 실행",
        quotaNote: "모델: {0} — 최우선순위 무료 티어를 사용한 뒤 쿨다운되고 다음으로 자동 전환됩니다.",
        working: "생성 중…", download: "MP3 다운로드",
        backendImage: "백엔드: {0} · {1}×{2}", backendTts: "백엔드: {0} · 음성: {1}",
        chatProvider: "{0} · {1} 응답", asrResult: "인식 결과 ({0}):", searchMeta: "백엔드: {0}",
        error: "오류: {0}",
        capOff: "{0} 사용 불가",
        hintChat: "대화는 라우터 경유 — 아래에서 모델 선택, forge-chat은 자동 페일오버.",
        hintImage: "이미지는 Pollinations (무료·키 불필요) 또는 로컬 ComfyUI.",
        hintTts: "음성은 edge-tts (무료·키 불필요).",
        hintSearch: "검색은 SearXNG / DuckDuckGo / Bing.",
        hintAsr: "음성 인식은 Whisper 필요 (pip install faster-whisper + FORGE_WHISPER_BIN).",
        hintVideo: "비디오는 FORGE_WAN_COMMAND (예: Wan 2.1) 필요.",
        missingKeys: "클라우드 프로바이더는 API 키 대기 중 — 각 사이트에서 무료 키를 받아 .env에 넣고 재시작하세요. 위 기능은 키 없이도 동작합니다."
      }
    };

    let LANG = "en";
    let CAPS = {};
    let MODEL_META = {}; // model value -> {label, provider, healthy, local}
    function t(key) {
      let s = (I18N[LANG] && I18N[LANG][key]) || I18N.en[key] || key;
      const args = Array.prototype.slice.call(arguments, 1);
      args.forEach((a, i) => { s = s.split("{" + i + "}").join(String(a)); });
      return s;
    }

    function setBadge(el, cls, txt) { el.textContent = txt; el.className = "badge " + cls; }

    async function loadCaps() {
      try {
        const res = await fetch(CORE + "/forge/health");
        if (!res.ok) throw new Error(String(res.status));
        CAPS = await res.json();
      } catch (_) { CAPS = {}; }
      renderCaps();
    }

    function capState(kind) {
      const list = (CAPS.capabilities || {})[kind] || [];
      const avail = list.some(b => b.available);
      return { available: avail, names: list.map(b => b.available ? b.name : null).filter(Boolean) };
    }

    function renderCaps() {
      const box = document.getElementById("capChips");
      box.innerHTML = "";
      const order = ["chat", "image", "tts", "search", "asr", "video"];
      const labels = { chat: t("t.kindChat"), image: t("t.kindImage"), tts: t("t.kindTts"),
        search: t("t.kindSearch"), asr: t("t.kindAsr"), video: t("t.kindVideo") };
      order.forEach(k => {
        const s = capState(k);
        const d = document.createElement("span");
        d.className = "badge " + (k === "chat" ? "ok" : s.available ? "ok" : "down");
        d.textContent = labels[k] + (k === "chat" ? "●" : "");
        if (s.names.length) d.title = s.names.join(", ");
        box.appendChild(d);
        let opt;
        try { opt = document.querySelector("#kind option[value='" + k + "']"); } catch (_) {}
        if (opt && k !== "chat" && k !== "image" && k !== "tts" && k !== "search" && !s.available) {
          opt.disabled = true;
        }
      });
    }

    async function loadModels() {
      const pick = document.getElementById("modelPick");
      try {
        const res = await fetch("/forge/models");
        if (!res.ok) throw new Error(String(res.status));
        const data = await res.json();
        MODEL_META = {};
        const sel = pick.value || "forge-chat";
        pick.innerHTML = "";
        const add = (val, label, healthy) => {
          const o = document.createElement("option");
          o.value = val; o.textContent = label;
          if (healthy === false) o.textContent += " · ⚠";
          pick.appendChild(o);
        };
        data.entries.forEach(e => {
          add(e.model, (e.local ? t("local") + " · " : "") + (e.auto ? "forge-chat · " + t("auto") : e.provider + ": " + e.label), e.healthy);
          MODEL_META[e.model] = e;
        });
        pick.value = MODEL_META[sel] ? sel : "forge-chat";
        onModelChange();
      } catch (_) {
        pick.innerHTML = '<option value="forge-chat">forge-chat · auto</option>';
        MODEL_META = { "forge-chat": { label: "forge-chat", provider: "*", healthy: true } };
      }
    }

    function onModelChange() {
      const pick = document.getElementById("modelPick");
      const state = document.getElementById("providerState");
      const meta = MODEL_META[pick.value];
      state.textContent = meta ? (meta.healthy ? t("modelStateOk") + (meta.local ? " · " + t("local") : "") : t("modelStateDown")) : "";
      state.className = "provider-state muted" + (meta && !meta.healthy ? " badge down" : "");
    }

    const HINTS = { chat: "hintChat", image: "hintImage", tts: "hintTts", search: "hintSearch", asr: "hintAsr", video: "hintVideo" };
    function onKindChange() {
      const kind = document.getElementById("kind").value;
      const prompt = document.getElementById("prompt");
      const file = document.getElementById("audioFile");
      const aspect = document.getElementById("aspect");
      const modelRow = document.getElementById("modelRow");
      prompt.style.display = kind === "asr" ? "none" : "";
      file.style.display = kind === "asr" ? "" : "none";
      aspect.style.display = kind === "image" ? "" : "none";
      modelRow.style.display = kind === "chat" ? "" : "none";
      document.getElementById("kindHint").textContent = t(HINTS[kind]);
    }

    async function refreshQuota() {
      const badge = document.getElementById("routerStatus");
      const rows = document.getElementById("quotaRows");
      try {
        const res = await fetch("/forge/quota");
        if (!res.ok) throw new Error(String(res.status));
        const data = await res.json();
        badge.textContent = t("routerOk");
        badge.className = "badge ok";
        rows.innerHTML = "";
        let noKeys = 0;
        data.providers.forEach(p => {
          const tr = document.createElement("tr");
          const pct = p.rpd ? Math.min(100, (p.requests_today / p.rpd) * 100) : 0;
          if (p.missing_key) noKeys++;
          let badgeHtml;
          if (p.missing_key) badgeHtml = '<span class="badge warn">' + t("nokey") + "</span>";
          else if (p.healthy) badgeHtml = '<span class="badge ok">' + t("ok") + "</span>";
          else badgeHtml = '<span class="badge down">' + t("down") + "</span>";
          tr.innerHTML = "<td>" + p.name + (p.local ? " (" + t("local") + ")" : "") + "</td>" +
            "<td>" + badgeHtml + "</td>" +
            "<td><div class='bar'><i style='width:" + pct + "%'></i></div>" + p.requests_today + (p.rpd ? "/" + p.rpd : "") + "</td>" +
            "<td>" + p.cooling_remaining + "s</td>";
          rows.appendChild(tr);
        });
        document.getElementById("quotaNote").textContent =
          (noKeys > 0 ? t("missingKeys") + " " : "") + t("quotaNote", data.model);
      } catch (err) {
        badge.textContent = t("routerOffline");
        badge.className = "badge down";
        rows.innerHTML = `<tr><td colspan="4" class="muted">${t("offlineRow", "forge up")}</td></tr>`;
      }
    }

    async function runChat(prompt, box) {
      const model = document.getElementById("modelPick").value;
      const res = await fetch("/v1/chat/completions", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ model, messages: [{ role: "user", content: prompt }], stream: false }),
      });
      const j = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(JSON.stringify(j).slice(0, 300));
      const text = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || "";
      const f = j._forge || {};
      box.innerHTML = `<div class="bubble">${text.replace(/</g, "&lt;")}</div>` +
        `<p class="muted">${t("chatProvider", f.provider || "?", f.model || "?")}</p>`;
      loadModels();
    }

    async function applyLang() {
      const lang = document.getElementById("lang").value;
      LANG = lang;
      localStorage.setItem("forge-lang", lang);
      document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
      document.querySelectorAll("[data-i18n-ph]").forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
      onKindChange();
      refreshQuota();
      loadCaps();
      loadModels();
    }

    document.getElementById("genForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const kind = document.getElementById("kind").value;
      const prompt = document.getElementById("prompt").value;
      const aspect = document.getElementById("aspect").value;
      const box = document.getElementById("result");
      box.innerHTML = '<span class="muted">' + t("working") + "</span>";
      try {
        if (kind === "chat") return await runChat(prompt, box);
        if (kind === "search") {
          const q = encodeURIComponent(prompt);
          const j = await (await fetch(CORE + "/v1/search?q=" + q + "&limit=8")).json();
          const list = (j.results || []).map(r =>
            `<li><a href="${r.url}" target="_blank" rel="noopener">${r.title}</a><br><span class="muted">${(r.snippet || "").replace(/</g, "&lt;")}</span></li>`).join("");
          box.innerHTML = `<p class="muted">${t("searchMeta", j.backend || "?")}</p><ul class="results">${list || "<li class=muted>…</li>"}</ul>`;
          return;
        }
        if (kind === "asr") {
          const file = document.getElementById("audioFile").files[0];
          if (!file) throw new Error("no file");
          const fd = new FormData(); fd.append("file", file);
          const j = await (await fetch(CORE + "/v1/asr", { method: "POST", body: fd })).json();
          box.innerHTML = `<p>${t("asrResult", j.language || "?")} <div class="bubble">${(j.text || "").replace(/</g, "&lt;")}</div></p>`;
          return;
        }
        const res = await fetch(CORE + "/v1/" + (kind === "image" || kind === "tts" ? kind : kind), {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(kind === "image"
            ? Object.assign({ prompt, aspect },
                document.getElementById("modelPick").value.startsWith("openrouter/")
                  ? { backend: "openrouter", model: document.getElementById("modelPick").value.slice("openrouter/".length) }
                  : {})
            : { text: prompt }),
        });
        const j = await res.json();
        if (!res.ok) throw new Error(JSON.stringify(j));
        if (kind === "image") {
          box.innerHTML = `<img class="result" src="${j.url}" alt="${prompt.replace(/"/g, "")}">` +
            `<p class="muted">${t("backendImage", j.backend, j.width, j.height)}</p>` +
            (j._note ? `<p class="badge warn">${j._note}</p>` : "");
        } else {
          box.innerHTML = `<a class="muted" href="${j.url}">${t("download")}</a> ` +
            `<p class="muted">${t("backendTts", j.backend, j.voice)}</p>`;
        }
      } catch (err) {
        box.innerHTML = `<span class="badge down">${t("error", err.message)}</span>`;
      }
    });

    document.getElementById("kind").addEventListener("change", onKindChange);
    document.getElementById("modelPick").addEventListener("change", onModelChange);
    const saved = localStorage.getItem("forge-lang");
    const nav = (navigator.language || "en").toLowerCase();
    document.getElementById("lang").value =
      saved || (nav.startsWith("zh") ? "zh" : nav.startsWith("ja") ? "ja" :
        nav.startsWith("ko") ? "ko" : "en");
    document.getElementById("lang").addEventListener("change", applyLang);
    applyLang();
    setInterval(refreshQuota, 10000);
  </script>
</body>
</html>
